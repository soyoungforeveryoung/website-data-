    hero_ingredient:
      name_ko: 힘바족 몰약(미르) 오일
      name_en: Himba myrrh oil
      status: confirmed
      story: |
        나미비아 사막의 힘바(Himba)족은 강한 햇빛과 사막의 건조함으로부터
        피부를 보호하기 위해 몰약(Myrrh) 오일을 사용해 왔다.
        이 바 솝은 그 몰약 오일을 힘바족에게서 직접 받아 만든다.

        영문 표기 (권장):
          The Himba people of the Namib Desert have long used myrrh oil to protect
          their skin from the harsh sun and the dryness of the desert.
          We source that same myrrh oil directly from the Himba, and it is what
          gives this bar its name and its purpose.
        국문 표기:
          나미비아 사막의 힘바족은 강렬한 햇빛과 사막의 건조함에서 피부를 지키기 위해
          오래도록 몰약 오일을 써 왔습니다. 이 비누는 그 몰약 오일을 힘바족에게
          직접 건네받아 만듭니다.

        표기 원칙 (반드시 포함):
          1. 힘바족이 왜 몰약을 쓰는가 — 햇빛과 건조함으로부터 피부 보호
          2. 직접 수급 — 중간 유통이 아니라 힘바족에게서 직접 받는다
          이 두 가지가 이 제품의 존재 이유이므로 어느 쪽도 생략하지 않는다.

          - 기존 표기 'in collaboration with the Himba tribe's ancestral rituals'는
            모호하므로 위 문안으로 교체한다.
          - 'tribe' 단독 표현보다 'the Himba people' / 'the Himba' 를 우선한다.
      pending:
        - 힘바족과의 거래 형태(공정무역, 수익 배분 등) 명문화 가능 여부.
          '직접 수급'을 광고에 쓰려면 근거를 문서로 갖고 있는 편이 안전하다.
    story:
      value: 나미비아 사막의 야생 몰약. 힘바족에게 직접 수급. 보호와 그라운딩.
      status: confirmed
