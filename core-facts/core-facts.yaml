# ------------------------------------------------------------
# 캔들 4종 공통
# ------------------------------------------------------------
candle_common:
  price_usd: { value: 85.00, status: confirmed }
  price_krw: { value: null, status: pending }
  net_wax_weight:
    value: 250
    unit: g
    status: confirmed
    note: |
      2026년 사양 변경. 이전 사양에서 250g으로 감량됨.
      사유 — 베슬에 왁스가 너무 꽉 차면 심지가 위로 올라와 터널링이 생김.
      상세페이지·패키지·양 사이트 모두 250g으로 통일한다.
  gross_weight:
    value: 2.3
    unit: POUNDS
    status: review
    note: |
      Shopify 등록값(약 1,043g). 베슬+왁스+박스 포함 배송중량으로 보임.
      순용량(250g)과 혼동되지 않도록 고객 노출 문구에는 250g만 쓴다.
  dimensions:
    value: null
    status: pending
    note: |
      기존 표기: '11 5/8 * 4 inches' (라벨 없음)
      → 오류가 아니라 '둘레 x 높이'로 추정됨. 검증 필요.

      추정 근거 (실측으로 확인 전까지 확정값 아님):
        왁스 250g, 밀도 약 0.9 g/cm3 -> 부피 약 278 cm3
        4 inches = 10.2 cm 를 베슬 높이로 보면
        11 5/8 inches = 29.5 cm 를 둘레로 보면 지름 9.4 cm
        지름 9.4 cm 기준 왁스 높이 약 4 cm -> 250g과 정합

      '9 inch' 설은 성립하지 않음. 23 cm 높이 베슬에 250g이면 바닥만 채워짐.

      확정 방법: 베슬 입구 바깥 지름과 전체 높이를 cm로 실측.
      표기는 '지름 x 높이' 형식으로 통일하고 cm 우선, inch 병기.
  burn_time:
    value: null
    status: conflict
    note: |
      기존 표기 60시간. 그러나 왁스 용량이 250g으로 변경되었으므로
      연소시간도 재산정해야 함. 이전 용량 기준 수치를 그대로 쓰면 안 됨.
  wax:
    value: Coconut-apricot wax blend
    status: review
    note: 파라핀 무첨가. 콜렉션별 차이 없는지 확인.
  wick:
    value: Lead-free organic cotton wick
    status: review
  claims:
    - { value: 100% vegan, status: review }
    - { value: Beeswax-free, status: review }
    - { value: Non-GMO, food-grade certified coconut oil, status: review }
    - { value: Paraben-free, status: review }
    - { value: Kosher, status: review }
    - { value: Cruelty-free, status: review }
  origin:
    value: Hand-poured in California, USA
    status: confirmed
    note: |
      캔들 4종 전부 미국 캘리포니아 생산.
      영문 표기: Hand-poured in California, USA
      국문 표기: 미국 캘리포니아 제조
      한국 사이트 원산지란도 '미국'으로 통일 (바 솝과 다르므로 주의).
  packaging_partner:
    value: light4life / Exceptional Children's Foundation
    status: review
    note: Bamboo Forest에만 기재. 4종 공통 여부 확인.
  vessel:
    value: Reusable vessel — 리필 또는 메탈 리드로 디퓨저 전환 가능
    status: review
  seed_packet:
    value: 향에 맞는 식물 씨앗 패킷 동봉
    status: review
    note: Bamboo Forest = Coriander. 나머지 3종 씨앗 종류 pending.

# ------------------------------------------------------------
# 바 솝 2종 공통
# ------------------------------------------------------------
bar_soap_common:
  price_usd: { value: 35.00, status: confirmed }
  price_krw: { value: null, status: pending }
  origin:
    value: Handmade in Korea
    status: confirmed
    note: |
      바 솝 2종 전부 한국 생산.
      영문 표기: Handmade in Korea
      국문 표기: 한국 제조
      캔들(미국)과 원산지가 다르므로 세트 상품 표기 시 각각 명시해야 함.
  product_descriptor:
    value: soap on a rope
    status: confirmed
    note: |
      영어권 통용 명칭. 2종 모두 이 표현으로 통일한다.
      수식어 위치에서는 하이픈 표기 soap-on-a-rope.
      금지 표현: hanging rope soap, rope bar soap, hanging bar soap.
  rope:
    value: Biodegradable linen-blend rope
    status: review
    note: 로프 소재는 명칭 뒤에 덧붙여 설명한다 (예: soap on a biodegradable linen-blend rope).
  net_weight:
    value: 250
    unit: g
    status: confirmed
    note: |
      2종 공통. 캔들과 동일한 250g.
      이로써 기존 충돌이 해소됨 —
        Charcoal Bar 0.6 lb(272g) = 250g + 포장 → 타당
        Myrrh Bar   0.2 lb(91g)              → 오류. Shopify 수정 필요.

