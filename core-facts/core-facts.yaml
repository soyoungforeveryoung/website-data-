# 바 솝 2종 공통
# ------------------------------------------------------------
bar_soap_common:
  price_usd: { value: 35.00, status: confirmed }
  price_krw: { value: null, status: pending }
  origin:
    value: Handmade in Korea
    status: confirmed
    note: |
      바 솝 2종 전부 한국 생산.
      영문 표기: Handmade in Korea
      국문 표기: 한국 제조
      캔들(미국)과 원산지가 다르므로 세트 상품 표기 시 각각 명시해야 함.
  production_method:
    value: 한국의 비누 장인이 수작업으로 제조, 자연 건조
    status: confirmed
    note: |
      영문 표기 (권장):
        Handmade by a master soap artisan in Korea, then naturally air-dried.
      국문 표기:
        한국의 비누 장인이 한 장 한 장 손으로 만들고 자연 건조한 비누입니다.

      표기 원칙:
        - 'handmade'만 쓰지 말고 '누가(장인) + 어디서(한국) + 어떻게(자연 건조)'를 함께 쓴다.
        - 자연 건조는 naturally air-dried / air-dried 로 쓴다.
          기계 건조와 대비되는 차별점이므로 빼지 않는다.
        - 금지: machine-pressed, mass-produced 를 연상시키는 표현

  cure_time:
    value: 약 1개월
    status: confirmed
    note: |
      영문 표기: cured and air-dried for about one month
      국문 표기: 약 한 달간 자연 건조

      상세페이지 활용: '자연 건조'만 쓰지 말고 기간을 반드시 함께 쓴다.
      한 달이라는 시간 자체가 대량생산과 구분되는 근거다.

  artisan:
    value: 비공개
    status: confirmed
    note: |
      비누 장인의 이름과 공방명은 공개하지 않는다.
      '한국의 비누 장인'으로만 지칭한다. 실명/공방명을 쓰지 말 것.

      대신 바 솝의 서사는 '원료의 출처'로 세운다 (아래 각 제품의 hero_ingredient 참조).
      Bamboo Forest = 영월 죽염, Bushman Candle = 힘바족 몰약.
      캔들이 조향사로 서사를 세운다면, 바 솝은 원료로 세운다.

  product_descriptor:
    value: soap on a rope
    status: confirmed
    note: |
      영어권 통용 명칭. 2종 모두 이 표현으로 통일한다.
      수식어 위치에서는 하이픈 표기 soap-on-a-rope.
      금지 표현: hanging rope soap, rope bar soap, hanging bar soap.

  rope:
    value: Biodegradable linen-blend rope
    status: confirmed
    note: "로프 소재는 명칭 뒤에 덧붙여 설명한다 (예: soap on a biodegradable linen-blend rope)."

  rope_benefits:
    status: confirmed
    note: |
      로프는 장식이 아니라 기능이다. 아래 4가지를 하나의 인과로 묶어서 쓴다.
      상세페이지에서 '왜 로프가 달려 있는가'를 설명하는 핵심 섹션이 된다.

      1) 샤워실에 걸어둘 수 있다
      2) 비누 받침(비누 접시)이 필요 없다
      3) 물에 잠기지 않으니 물러지거나 녹지 않는다
      4) 그래서 훨씬 오래 간다 = 지속 가능하다

      인과 구조 (이 순서를 지킬 것):
        걸어둔다 -> 물이 빠진다 -> 무르지 않는다 -> 오래 간다 -> 덜 버린다

      영문 문안 (권장):
        The rope is not decoration. Hang the bar in your shower and it drains
        as it dries, so it never sits in a pool of water. No soap dish needed,
        no soft mushy bar, no waste. It simply lasts longer.

      국문 문안 (권장):
        로프는 장식이 아닙니다. 샤워실에 걸어두면 물이 빠지면서 마르기 때문에
        비누가 물에 잠길 일이 없습니다. 비누 받침이 따로 필요 없고,
        물러지거나 녹아 없어지지 않아 훨씬 오래 씁니다.

      주의:
        - '지속 가능(sustainable)'은 결론으로만 쓴다.
          앞의 1~3을 생략하고 '지속 가능한 비누'라고만 하면 근거 없는 주장이 된다.
        - 다 쓰고 나면 로프는 생분해된다는 점도 함께 언급한다.
  net_weight:
    value: 255
    unit: g
    status: confirmed
    note: |
      2026-09-10 확정. 바 솝 2종 모두 255g으로 동일하다.
      한국 사이트 옵션명(255g)이 정본.
      Charcoal Bar 0.6 lb(272g) = 255g + 포장 -> 타당.

      🔴 Shopify 수정 필요:
         Myrrh Protection Bar 등록 중량이 0.2 lb(약 91g)로 잘못되어 있다.
         Charcoal Bar와 동일한 255g 기준으로 수정할 것.

