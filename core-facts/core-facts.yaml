# ============================================================
# leverden 코어팩트 원장 (Single Source of Truth)
# ============================================================
# 이 파일이 원본이다. Shopify(leverden.co)와 Cafe24(leverden.co.kr)는
# 이 파일에 맞춰 수정한다. 반대 방향은 없다.
#
# status 값의 의미
#   confirmed : 소영님이 확인 완료. 그대로 적용.
#   review    : Shopify에서 가져왔으나 검증 필요.
#   conflict  : 채널 간 값이 다름. 결정 필요.
#   pending   : 값 없음. Cafe24 데이터 또는 소영님 확인 대기.
# ============================================================

meta:
  version: 0.2
  authority: |
    향료 노트와 배합에 관한 사항은 소영님이 조향사와 직접 논의해 확정한 것이며,
    향료 서류(IFRA 인증서, 알레르겐 선언서, SDS)도 소영님이 직접 관리한다.
    향 관련 정보의 원본은 소영님 확인이다. 사이트 기재값이 아니다.
  updated: 2026-09-09
  phase: 1
  scope: 2026년 말까지 KR·US·EU 판매 6종
  sources:
    shopify: data/shopify-core6-raw.json   # 2026-09-09 추출
    cafe24: null                            # pending — 관리자 상품 엑셀 필요

# ============================================================
# 콜렉션 — 무드와 영감
# ============================================================
# 미국(Shopify)과 한국(Cafe24) 양쪽 모두 이 내용을 기준으로 쓴다.
# 채널별로 다른 이야기를 하지 않는다. 번역만 다르고 내용은 하나다.
# ============================================================

collections:

  # 작성 원칙
  #   scent_in_one_line 을 항상 노트 목록보다 먼저 쓴다.
  #   '유향, 핑크 페퍼콘, 라브다넘'을 아는 소비자는 거의 없다.
  #   무슨 향인지 한 줄로 먼저 알려주고, 노트는 그 다음에 근거로 붙인다.
  #
  # 참고 용어
  #   유향(乳香) = Olibanum = Frankincense. 보스웰리아 나무의 수지.
  #                서늘하고 은은히 달며 나무/수지 느낌. 성당·절의 향 계열.
  #   몰약(沒藥) = Myrrh = Commiphora 속 나무의 수지.

  bamboo_forest:
    name_en: { value: Bamboo Forest, status: confirmed }
    name_ko: { value: 뱀부 포레스트, status: confirmed }
    scent_in_one_line:
      ko: { value: "비 온 뒤 숲 냄새. 젖은 흙과 풀, 초록빛의 서늘하고 맑은 향", status: confirmed }
      en: { value: "The smell of a forest after rain - wet earth, wet grass, green and cool", status: confirmed }
    mood:
      en: { value: Relaxation, status: confirmed }
      ko: { value: 릴렉세이션, status: confirmed }
    inspiration:
      status: confirmed
      ko: |
        한국의 대나무 숲.
        젖은 흙냄새, 젖은 풀냄새, 이슬을 머금은 공기.
      en: |
        A bamboo forest in Korea.
        Wet earth, wet grass, air still holding the dew.
      note: |
        핵심은 '대나무'라는 식물이 아니라 '비 온 뒤 숲의 공기'다.
        젖은 흙 / 젖은 풀 / 이슬 - 이 세 가지 감각을 반드시 담는다.
        기존 카피의 '산뜻한', '청량한' 만으로는 부족하다.

  bushman_candle:
    name_en: { value: Bushman Candle, status: confirmed }
    name_ko: { value: 부시맨 캔들, status: confirmed }
    naming_note: |
      'Bushman Candle / 부시맨 캔들'은 식물(원료) 이름이다.
      국문은 띄어 쓴다. 붙여 쓰지 않는다.
      제품명에서 '캔들'이 두 번 반복되어도 그대로 둔다.
        르버덴 부시맨 캔들 센티드 캔들
        Bushman Candle Scented Candle
      앞의 '캔들'은 원료명의 일부, 뒤의 '캔들'은 제품 종류다. 생략하면 뜻이 달라진다.
    scent_in_one_line:
      ko: { value: "스파이시하고 이국적인 향. 마른 사막의 수지와 향신료, 연기", status: confirmed }
      en: { value: "Spicy and exotic - dry desert resin, spice, and smoke", status: confirmed }
    mood:
      en: { value: Energy, status: confirmed }
      ko: { value: 에너지, status: confirmed }
    inspiration:
      status: confirmed
      ko: |
        나미비아 사막의 힘바족. 물이 극히 귀한 환경이어서
        힘바 여성들은 전통적으로 물로 씻지 않고,
        부시맨 캔들 식물을 태운 연기로 몸을 씻어 왔다.
        그 연기의 향에서 영감을 받아 만든 향이다.
      en: |
        The Himba of the Namib Desert. Water is scarce, and Himba women have
        traditionally cleansed themselves not with water but with the smoke of
        the burning bushman candle plant. This scent comes from that smoke.
      note: |
        이 콜렉션의 핵심 서사다. '나미비아 사막'만 말하고 끝내면 절반도 전달되지 않는다.
        물 대신 연기로 씻는다 -> 그 연기의 향 -> 이 캔들.
        이 인과가 들어가야 '왜 이 향인가'가 설명된다.
      attribution: { value: 힘바(Himba)족 여성의 전통, status: confirmed }

      direct_sourcing:
        status: confirmed
        requirement: |
          🔴 필수 기재 사항.
          힘바족에게서 직접 공수받은 원료를 쓴다는 점을 반드시 명시한다.
          이 콜렉션을 '영감을 받은 향'으로만 소개하면 핵심이 빠진다.
          영감이 아니라 실제 거래이며, 그것이 이 브랜드가 다른 브랜드와 다른 지점이다.

        confirmed_materials:
          - material: Commiphora wildii (Omumbiri) 오일
            sourcing: 힘바 커뮤니티 트러스트(KCINPT) -> Opuwo Processing Facility -> leverden
            product: Bushman Candle Myrrh Protection Bar
            evidence: 2022년 수급 메일 + KCINPT 제품 도시에 (docs/myrrh-sourcing.md)

        wording_example:
          ko: 힘바 커뮤니티 트러스트에서 직접 건네받은 오일을 그대로 담았습니다.
          en: Sourced directly from the Himba community trust.

        candle_namibian_materials:
          status: confirmed
          date: 2026-09-10
          materials:
            - Bushman Candle Oil (나미비아산)
            - Blue Ginger (나미비아산)
          note: |
            캔들에도 나미비아산 원료가 들어간다.
            따라서 캔들에도 '나미비아 원료를 쓴다'고 명시할 수 있다.
            향의 성격: 스파이시하고 이국적이다.

        pending:
          - |
            위 두 원료의 수급 경로 확인.
            힘바족/커뮤니티 트러스트에서 직접 받는지, 향료사(AFM)를 통해 조달되는지에 따라
            쓸 수 있는 문구가 달라진다.
              직접 수급이면 - 힘바족에게서 직접 공수받은 원료
              향료사 경유면 - 나미비아산 원료
            확인 전까지는 '나미비아산 원료'까지만 쓴다.

        bonus_story:
          status: confirmed
          note: |
            유향(Olibanum, frankincense)은 캔들에, 몰약(Myrrh)은 바 솝에 들어간다.
            두 원료는 동방박사의 세 선물 중 둘이며, 이 콜렉션이 둘을 모두 갖고 있다.

      writing_guidance: |
        ⚠️ 표현 방식에 주의한다. 사실은 같아도 프레이밍에 따라 전혀 다르게 읽힌다.

        ✅ 권장 — 물 부족이라는 환경 조건과 그에 대한 지혜로 서술
           "사막에서 물은 귀하다. 힘바 여성들은 물 대신 연기로 몸을 씻는 방법을 지켜 왔다."
           "Water is scarce in the desert. Himba women have long cleansed
            themselves with smoke instead."

        ⛔ 지양 — 금지/제약의 프레이밍
           "여자는 물로 씻지 못하게 되어 있어서…"
           "women are not allowed to bathe with water"
           사실 관계와 별개로, 서구 시장에서 타 문화를 억압적으로 묘사한다는
           비판을 받기 쉽다. 브랜드가 감당할 이유가 없는 리스크다.

        원칙: 제약이 아니라 '환경에 적응한 방식'으로 쓴다.
              힘바 여성을 대상이 아니라 지혜의 주체로 둔다.

      pending:
        - OPF/KCINPT가 문서화한 범위와 대조할 것 (INP-book).
          전통지식(TK)은 나미비아 ABS 법제 대상이므로
          문서화되지 않은 내용을 새로 서술하지 않는다.

  shaman:
    name_en: { value: Shaman, status: confirmed }
    name_ko: { value: 샤먼, status: confirmed }
    scent_in_one_line:
      ko: { value: "나무를 태운 연기와 서늘한 허브. 절이나 성당의 향 계열", status: confirmed }
      en: { value: "Woodsmoke and cool herbs - the register of incense in a temple", status: confirmed }
    mood:
      en: { value: Purification, status: confirmed }
      ko: { value: 정화, status: confirmed }
      note: |
        2026-09-10 변경. 이전에 Meditation & Grounding으로 잡았던 것을 정정한다.

        ⚠️ 표현 주의 - '정화'는 이 콜렉션의 정서적 무드이지 제품의 기능이 아니다.
           안전: 마음을 정화하는 의식, 공간을 정돈하는 향, a ritual of purification
           금지: 공기 정화, 살균, 탈취, purifies the air, antibacterial
           Shopify의 'Purifies the environment'는 금지 사례에 해당한다. 삭제 대상.
    inspiration:
      status: confirmed
      ko: |
        페루 샤먼들의 의식. 팔로 산토를 태우는 리추얼의 향기에서 영감을 받았다.
      en: |
        The rituals of Peruvian shamans, and the scent of burning palo santo.
      note: 기존 카피의 '고대 샤머니즘'은 모호하다. '페루'와 '팔로 산토 리추얼'로 구체화한다.
      palo_santo_origin: { value: 페루산, status: confirmed }
      pending:
        - 팔로 산토 학명 확인 (향료사에 문의).
          '팔로 산토'로 불리는 나무는 여럿이며 규제 지위가 다르다.
            Bursera graveolens  - 페루/에콰도르산. CITES 규제 대상 아님
            Guaiacum spp.       - CITES 부속서 II 규제 대상
          페루산은 통상 Bursera graveolens이나, 학명을 문서로 확인해 두는 편이 안전하다.
        - 페루 수출 관련 서류(SERFOR 등) 및 지속가능 수급 근거.
          근거 없는 sustainable 표현은 그린워싱이 된다.

  valley_of_roses:
    name_en: { value: Valley of Roses, status: confirmed }
    name_ko: { value: 밸리 오브 로지즈, status: confirmed }
    scent_in_one_line:
      ko: { value: "갓 자른 생장미. 달콤하기보다 싱그럽고 촉촉한", status: confirmed }
      en: { value: "Freshly cut roses - dewy and green rather than sweet", status: confirmed }
    mood:
      en: { value: Self-love, status: confirmed }
      ko: { value: 셀프 러브, status: confirmed }
      rationale_ko: |
        장미는 사랑의 상징이다. 사랑에는 여러 가지가 있지만,
        모든 사랑은 자기 자신을 사랑하는 데서 시작한다.
      rationale_en: |
        The rose is the symbol of love. Love takes many forms,
        but every kind of love begins with loving yourself.
      note: |
        이 논리가 카피에 드러나야 한다. 그냥 self-love라고만 쓰면 근거가 없다.
        장미 -> 사랑 -> 사랑의 시작은 자기 자신 -> self-love. 이 연결을 보여준다.
    inspiration:
      status: confirmed
      ko: |
        모로코 최대의 야생 장미 마을. 그곳의 모로칸 로즈 오일을 사용한다.
      en: |
        Morocco's largest wild rose village. We use Moroccan rose oil from there.
      note: 향의 모티프가 아니라 실제 원료를 쓴다는 점이 핵심이다.
      village: { value: "Kelaat M'Gouna (엘켈라 데 므구나)", status: confirmed }
      sourcing:
        value: 모로칸 로즈 오일을 장미의 계곡(Valley of Roses)에서 직접 받아 사용한다
        status: confirmed
        note: |
          콜렉션명 Valley of Roses가 실제 산지명과 일치한다.
          향의 모티프가 아니라 그 계곡의 로즈 오일을 실제로 쓴다는 점이
          이 콜렉션의 핵심이며, 이름과 원료가 일치하는 유일한 콜렉션이다.
      pending:
        - 모로칸 로즈 오일 공급처명과 서류(COA, 알레르겐 선언서)


