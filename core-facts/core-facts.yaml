    value: leverden
    status: confirmed
    note: 상표권 이슈로 leVerden에서 변경. 전부 소문자 한 단어. 예외 없음.
  perfumer:
    value: Christophe Laudamiel
    status: review
    note: |
      현재 Bamboo Forest 캔들/바 솝에만 기재됨.
      나머지 4종에도 동일 조향사인지 확인 필요.
      본문에 'Laudimiel' 오타 있음 (정: Laudamiel).
  trademark:
    air_sculpture:
      value: Air Sculpture®
      status: review
      note: 조향사 소유 상표. 표기 시 ® 유지.

# ------------------------------------------------------------
# 캔들 4종 공통
# ------------------------------------------------------------
candle_common:
  price_usd: { value: 85.00, status: confirmed }
  price_krw: { value: null, status: pending }
  net_wax_weight:
    value: 250
    unit: g
    status: confirmed
    note: |
      2026년 사양 변경. 이전 사양에서 250g으로 감량됨.
      사유 — 베슬에 왁스가 너무 꽉 차면 심지가 위로 올라와 터널링이 생김.
      상세페이지·패키지·양 사이트 모두 250g으로 통일한다.
  gross_weight:
    value: 2.3
    unit: POUNDS
    status: review
    note: |
      Shopify 등록값(약 1,043g). 베슬+왁스+박스 포함 배송중량으로 보임.
      순용량(250g)과 혼동되지 않도록 고객 노출 문구에는 250g만 쓴다.
  dimensions:
    outer_diameter: { value: 9, unit: cm, status: confirmed }
    inner_diameter: { value: 8, unit: cm, status: confirmed }
    height_with_lid: { value: 10, unit: cm, status: confirmed }
    inner_depth: { value: 7, unit: cm, status: review, note: 충전률 80%에서 역산 (5.5 / 0.8). 실측 권장 }
    height_vessel_only: { value: null, unit: cm, status: pending }
    lid_height: { value: null, unit: cm, status: pending }
    glass: { value: 두꺼운 유리 — 외경 9cm / 내경 8cm (벽 두께 약 5mm), status: confirmed }
    status: confirmed
    note: |
      독립된 두 출처가 일치하여 확정.
        1) 기존 Shopify 표기 '11 5/8 * 4 inches' = 둘레 29.5cm(지름 9.4cm) x 높이 10.2cm
        2) 소영님 확인: 지름 9cm x 높이 10cm
      기존 표기는 오류가 아니라 '둘레 x 높이'에 라벨이 없었던 것.

      표기 형식: 지름 9cm x 높이 10cm (뚜껑 포함)
      inch 병기 시 3.5" x 3.9"

      높이 표기 원칙 (중요):
        - 10cm는 '뚜껑 포함' 높이다. 반드시 '(뚜껑 포함)'을 함께 쓴다.
        - 라벨 없이 '높이 10cm'만 쓰면 유리 높이로 오해된다.
          기존 '11 5/8 * 4 inches'가 라벨 누락으로 오해를 부른 것과 같은 실수를 반복하지 않는다.
        - 유리 단독 높이와 뚜껑 높이는 별도 필드로 관리 (현재 pending).
        - 고객 노출 지름은 외경 9cm. 내경 8cm는 내부 사양으로만 쓴다.
      금지: 라벨 없는 숫자 나열, 둘레를 지름처럼 표기하는 것.

  lid:
    material: { value: 세라믹 (ceramic), status: confirmed }
    note: |
      영문 표기: ceramic lid
      금지: metal lid, wooden lid 등 다른 소재로 표기하지 말 것.
      별도 판매 중인 'Metal Diffuser lid'(캔들 베슬을 디퓨저로 재활용하는 액세서리)와
      혼동하지 않도록 주의. 기본 동봉 뚜껑은 세라믹이다.

      마케팅 포인트: 세라믹 뚜껑은 향 보존력과 질감 면에서 프리미엄 요소이므로
      제품 설명과 제품컷에서 적극적으로 노출한다.

  wax_fill_level:
    value: 80
    unit: percent
    status: confirmed
    wax_height: { value: 5.5, unit: cm, status: review, note: 계산값 }
    note: |
      충전률 80% 확정.

      정합성 확인 (모든 수치가 일치함):
        내경 8cm -> 단면적 50.3 cm2
        왁스 250g / 밀도 약 0.9 -> 부피 278 cm3 -> 왁스 높이 약 5.5 cm
        5.5 / 0.8 = 내부 깊이 약 7 cm
        내부 깊이 7cm + 두꺼운 바닥 + 세라믹 뚜껑 = 전체 10cm

      의도된 사양임 — 왁스를 꽉 채우면 심지가 위로 밀려 올라와 터널링이 발생하므로
      상단에 약 2cm 헤드스페이스를 남긴다.
      80% 충전은 시각적으로도 충분히 차 보이는 수준이므로 문제 없음.

      마케팅 활용: '덜 채운 것'이 아니라 '터널링 없이 끝까지 고르게 타도록 설계된 충전량'
      으로 설명한다. 소비자에게는 결점이 아니라 설계 의도로 전달되어야 한다.

  burn_time:
    value: 60
    unit: hours
    status: confirmed
    note: |
      오가닉 코튼 싱글 윅 기준 약 60시간.

      정합성 확인: 왁스 250g / 60시간 = 시간당 약 4.2g.
      싱글 윅의 일반적 연소율 범위에 들어오므로 수치상 타당하다.

      표기:
        영문 - Burn time: approx. 60 hours
        국문 - 연소시간 약 60시간
      '약(approx.)'을 붙인다. 실내 온도, 통풍, 심지 관리에 따라 달라지므로
      단정 표기는 피한다.

  wax:
    manufacturer: { value: Stone Candles (California, USA), status: confirmed }
    base: { value: Coconut apricot wax, status: confirmed }
    additive: { value: Apricot seed oil, status: confirmed }
    status: confirmed
    note: |
      코코넛 왁스 베이스 + 애프리컷 씨드 오일 블렌드. 캔들 4종 공통.
      파라핀 무첨가.

      코코넛 애프리컷 왁스. 카피에서는 코코넛 왁스로 표기한다.

      참고 (2026-09-09): Stone Candles 일반 제품 라인 검색 결과에
      soy wax / stearic acid 언급이 있었으나, 이는 leverden 전용 왁스 사양이
      아닐 수 있고 페이지 원문도 확인하지 못했다. 근거가 약하므로 카피에 반영하지 않는다.
      스펙시트 수령 시 최종 확인한다. 상세: data/supplier/stone-candles-wax.md

      제조사 인증 문구의 적용 범위:
        non-GMO -> 코코넛(원료)에 한정
        food grade certified -> 코코넛 '오일'에 한정
        -> '푸드 그레이드 코코넛 왁스'는 범위를 넘어선 표기다.

      표기 (제조사 자료 확정 전까지 잠정):
        영문 - a natural coconut apricot wax blend, made with food-grade certified coconut oil
        국문 - 푸드 그레이드 인증 코코넛 오일로 만든 코코넛 애프리컷 천연 왁스

      표기 원칙 (중요):
        - 애프리컷은 '왁스'가 아니라 '씨드 오일'이다.
          'coconut-apricot wax'처럼 붙여 쓰면 애프리컷도 왁스인 것처럼 읽히므로 쓰지 않는다.
          반드시 'coconut wax and apricot seed oil' 로 분리해서 쓴다.
        - 긍정형 표기(coconut apricot wax)는 문제없다.
        - 다만 'soy-free', '무소이', '100% 코코넛 왁스' 같은 부정형/절대 주장은
          스펙시트로 배합비를 확인하기 전까지 쓰지 않는다.
          긍정 표현에는 근거가 필요 없지만 부정 주장에는 필요하다.
        - 파라핀 무첨가(paraffin-free)를 함께 표기한다.
        - '푸드 그레이드'는 코코넛 왁스에만 붙는다. 애프리컷 씨드 오일이나
          제품 전체에 붙이지 않는다.
        - 주의: 푸드 그레이드는 '식품에도 쓸 수 있는 등급의 원료'라는 뜻이지
          '먹어도 된다'는 뜻이 아니다. 캔들을 식용으로 오인시키는 문구
          (edible, safe to eat 등)는 절대 쓰지 않는다.
          공기 중으로 나오는 것을 마시게 되는 제품이므로 원료 등급이 높다는
          맥락에서만 사용한다.

      확정 조건 (제조사로부터 받아야 함):
        - 왁스 배합비 (코코넛/소이/스테아릭산/애프리컷 오일)
        - non-GMO, kosher, food grade 각 인증서 (발급기관, 번호, 유효기간)
      받기 전까지 non-GMO 문구는 사이트에서 내리는 것을 권장한다.

      INCI 참고 (라벨 작성 시): Prunus armeniaca (apricot) kernel oil
      -> 라벨용 정식 성분명은 제조처 확인 후 확정할 것.
  wick:
    material: { value: Organic cotton (lead-free), status: confirmed }
    count: { value: 1, status: confirmed }
    note: |
      싱글 윅. 오가닉 코튼, 납 심지 아님.
      영문 표기: a single lead-free organic cotton wick
      국문 표기: 오가닉 코튼 심지 1개

      사용 안내에 반드시 포함할 것 (심지 1개 + 내경 8cm 조합에서 특히 중요):
        - 첫 사용 시 표면 전체가 녹을 때까지 2~3시간 연소 (터널링 방지)
        - 매 사용 전 심지를 3~5mm로 자를 것
        - 1회 3시간 이상 연속 연소 금지
  claims:
    - { value: 100% vegan, status: review }
    - { value: Beeswax-free, status: review }
    - { value: Non-GMO, food-grade certified coconut oil, status: review }
    - { value: Paraben-free, status: review }
    - { value: Kosher, status: review }
    - { value: Cruelty-free, status: review }
  origin:
    value: Hand-poured in California, USA
    status: confirmed
    note: |
      캔들 4종 전부 미국 캘리포니아 생산.
      영문 표기: Hand-poured in California, USA
      국문 표기: 미국 캘리포니아 제조
      한국 사이트 원산지란도 '미국'으로 통일 (바 솝과 다르므로 주의).
  packaging_partner:
    value: light4life / Exceptional Children's Foundation
    status: review
    note: Bamboo Forest에만 기재. 4종 공통 여부 확인.
  vessel:
    value: Reusable vessel — 리필 또는 메탈 리드로 디퓨저 전환 가능
    status: review
  seed_packet:
    value: 문구 삭제 (2026-09-10)
    status: confirmed
    note: |
      씨앗 동봉은 상시 제공 사항이 아니다. 주문 시 개별 대응하되
      제품 설명에는 표기하지 않는다. 향후 별도 상품으로 판매 검토 중.

      조치: 사이트와 모든 자료에서 씨앗 관련 문구를 삭제한다.
      현재 남아있는 문구 (삭제 대상):
        - Bamboo Forest 캔들 product_info Description:
          'Comes with a packet of Coriander seeds reminiscent of the Collection scent'
        - 같은 제품 Sustainable Packaging 문단의
          'cultivate new life with the plant seed packets that are included and
           shipped in every candle'
      -> 동봉하지 않는데 동봉된다고 표기하면 표시광고 위반이다. 우선 삭제할 것.

# ------------------------------------------------------------
# 바 솝 2종 공통
# ------------------------------------------------------------
bar_soap_common:
  price_usd: { value: 35.00, status: confirmed }
  price_krw: { value: null, status: pending }
  origin:
    value: Handmade in Korea
    status: confirmed
    note: |
      바 솝 2종 전부 한국 생산.
      영문 표기: Handmade in Korea
      국문 표기: 한국 제조
      캔들(미국)과 원산지가 다르므로 세트 상품 표기 시 각각 명시해야 함.
  production_method:
    value: 한국의 비누 장인이 수작업으로 제조, 자연 건조
    status: confirmed
    note: |
      영문 표기 (권장):
        Handmade by a master soap artisan in Korea, then naturally air-dried.
      국문 표기:
        한국의 비누 장인이 한 장 한 장 손으로 만들고 자연 건조한 비누입니다.

      표기 원칙:
        - 'handmade'만 쓰지 말고 '누가(장인) + 어디서(한국) + 어떻게(자연 건조)'를 함께 쓴다.
        - 자연 건조는 naturally air-dried / air-dried 로 쓴다.
          기계 건조와 대비되는 차별점이므로 빼지 않는다.
        - 금지: machine-pressed, mass-produced 를 연상시키는 표현

  cure_time:
    value: 약 1개월
    status: confirmed
    note: |
      영문 표기: cured and air-dried for about one month
      국문 표기: 약 한 달간 자연 건조

      상세페이지 활용: '자연 건조'만 쓰지 말고 기간을 반드시 함께 쓴다.
      한 달이라는 시간 자체가 대량생산과 구분되는 근거다.

  artisan:
    value: 비공개
    status: confirmed
    note: |
      비누 장인의 이름과 공방명은 공개하지 않는다.
      '한국의 비누 장인'으로만 지칭한다. 실명/공방명을 쓰지 말 것.

      대신 바 솝의 서사는 '원료의 출처'로 세운다 (아래 각 제품의 hero_ingredient 참조).
      Bamboo Forest = 영월 죽염, Bushman Candle = 힘바족 몰약.
      캔들이 조향사로 서사를 세운다면, 바 솝은 원료로 세운다.

  product_descriptor:
    value: soap on a rope
    status: confirmed
    note: |
      영어권 통용 명칭. 2종 모두 이 표현으로 통일한다.
      수식어 위치에서는 하이픈 표기 soap-on-a-rope.
      금지 표현: hanging rope soap, rope bar soap, hanging bar soap.

  rope:
    value: Biodegradable linen-blend rope
    status: confirmed
    note: 로프 소재는 명칭 뒤에 덧붙여 설명한다 (예: soap on a biodegradable linen-blend rope).

  rope_benefits:
    status: confirmed
    note: |
      로프는 장식이 아니라 기능이다. 아래 4가지를 하나의 인과로 묶어서 쓴다.
      상세페이지에서 '왜 로프가 달려 있는가'를 설명하는 핵심 섹션이 된다.

      1) 샤워실에 걸어둘 수 있다
      2) 비누 받침(비누 접시)이 필요 없다
      3) 물에 잠기지 않으니 물러지거나 녹지 않는다
      4) 그래서 훨씬 오래 간다 = 지속 가능하다

      인과 구조 (이 순서를 지킬 것):
        걸어둔다 -> 물이 빠진다 -> 무르지 않는다 -> 오래 간다 -> 덜 버린다

      영문 문안 (권장):
        The rope is not decoration. Hang the bar in your shower and it drains
        as it dries, so it never sits in a pool of water. No soap dish needed,
        no soft mushy bar, no waste. It simply lasts longer.

      국문 문안 (권장):
        로프는 장식이 아닙니다. 샤워실에 걸어두면 물이 빠지면서 마르기 때문에
